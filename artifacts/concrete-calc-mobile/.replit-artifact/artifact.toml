kind = "mobile"
previewPath = "/"
title = "حاسبة الخرسانة - موبايل"
version = "1.0.0"
id = "artifacts/concrete-calc-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25163

[services.development]
run = "pnpm --filter @workspace/concrete-calc-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/concrete-calc-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/concrete-calc-mobile", "run", "serve" ]

[services.env]
PORT = "25163"
BASE_PATH = "/"
